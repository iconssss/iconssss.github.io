<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">XR-1 action-prefix temporal alignment result</title>
  <desc id="desc">As the phase offset increases, a self-generated prefix causes growing right-arm position and rotation degradation.</desc>
  <rect width="1200" height="440" rx="24" fill="#f7f9fc"/>
  <text x="60" y="60" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#172033">Native prefix support ≠ latency robustness</text>
  <text x="60" y="96" font-family="Arial, sans-serif" font-size="18" fill="#536079">5.1B XR-1 VLA · 190 generations · 4×RTX 4090 · 288 ms mean latency</text>
  <g font-family="Arial, sans-serif">
    <rect x="60" y="145" width="300" height="122" rx="18" fill="#ffffff" stroke="#4b77be" stroke-width="3"/>
    <text x="85" y="182" font-size="20" font-weight="700" fill="#214a84">Stale observation</text>
    <text x="85" y="216" font-size="17" fill="#172033">Robot moves while XR-1 infers</text>
    <text x="85" y="245" font-size="15" fill="#536079">new chunk arrives at a later phase</text>
    <path d="M374 199h74" stroke="#7b879d" stroke-width="5"/><path d="M440 187l18 12-18 12z" fill="#7b879d"/>
    <rect x="472" y="145" width="300" height="122" rx="18" fill="#ffffff" stroke="#d68a24" stroke-width="3"/>
    <text x="497" y="182" font-size="20" font-weight="700" fill="#9a5b0b">Self-generated prefix</text>
    <text x="497" y="216" font-size="17" fill="#172033">causal old-plan actions only</text>
    <text x="497" y="245" font-size="15" fill="#536079">no teacher future leakage</text>
    <path d="M786 199h74" stroke="#7b879d" stroke-width="5"/><path d="M852 187l18 12-18 12z" fill="#7b879d"/>
    <rect x="884" y="128" width="256" height="156" rx="18" fill="#fff5f3" stroke="#d15b4f" stroke-width="3"/>
    <text x="909" y="169" font-size="20" font-weight="700" fill="#a43c33">Larger handoff error</text>
    <text x="909" y="213" font-size="27" font-weight="700" fill="#172033">−117.4 mm</text>
    <text x="909" y="247" font-size="23" font-weight="700" fill="#172033">−40.14° at k=12</text>
    <rect x="60" y="318" width="1080" height="70" rx="16" fill="#eef3f9"/>
    <text x="85" y="349" font-size="17" fill="#172033">Controlled verdict:</text>
    <text x="245" y="349" font-size="17" font-weight="700" fill="#172033">self-prefix conditioning degraded right-arm alignment at medium/high offsets.</text>
    <text x="85" y="375" font-size="15" fill="#536079">The benchmark establishes a system boundary, not a universal impossibility claim.</text>
  </g>
</svg>
