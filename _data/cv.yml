    Projects:
      - name: SmolVLA Fine-Tuning and 400-Episode Closed-Loop Evaluation
        summary: >
          Completed an auditable, single-RTX-4090 SmolVLA adaptation workflow
          from pinned pretrained-policy initialization to a frozen 100K-update
          checkpoint and four-suite LIBERO evaluation.
        highlights:
          - Fine-tuned for 100,000 optimizer updates at effective batch 64 (6.4M sample presentations), with 99.88M / 450.05M parameters trainable and the vision encoder frozen; preserved frozen configs, hashes, logs, and rollout evidence.
          - Evaluated 40 tasks over 400 fixed-init closed-loop episodes, reaching 71.5% endpoint success overall: 82% Spatial, 78% Object, 80% Goal, and 46% Long.
          - Resolved the checkpoint-to-LIBERO 3-camera/6D/6D versus 2-camera/8D/7D runtime-contract mismatch; verified strict offline reload with zero missing, unexpected, or shape-mismatched keys.

      - name: Latency-Aware Runtime for Closed-Loop Robot Policies
        summary: >
          Designed an asynchronous learned-policy runtime that tracks action
          provenance and controls scheduler-induced staleness through explicit
          synchronous, FIFO, and latest-only semantics.
        highlights:
          - Decomposed action age into observation wait, inference latency, and post-inference wait, with per-action timestamp and queue-depth instrumentation.
          - On MuJoCo Reacher at 100 ms policy latency, LATEST reduced p95 action age from 1.24 s to 150 ms and improved success from 20% to 100% while preserving approximately 20 Hz control.
          - Validated the mechanism on both a learned action-chunk benchmark and an independent MuJoCo environment with a fixed learned SAC policy.

      - name: Metric 3D Representations for Low-Data Visuomotor Control
        summary: >
          Built a calibrated RGB-D to world-frame point-cloud pipeline and a
          compact PointNet policy, then mapped sample efficiency, viewpoint
          robustness, occlusion recovery, and calibration failure boundaries.
        highlights:
          - Achieved 95% closed-loop success with 50 demonstrations and 100% with 250 demonstrations on a contact-free MuJoCo Panda reach task.
          - Retained 96.7–100% success across 0–45° camera motion by reconstructing observations into a common world frame.
          - Restored strong-occlusion performance from 3.3% to 100% through two-view fusion without policy retraining; quantified collapse under depth and extrinsic error.

    Research and Engineering Focus:
      - bullet: Visuomotor policy learning for manipulation, including imitation learning, action chunking, replanning, generalization, and closed-loop evaluation.
      - bullet: VLA training and evaluation systems, with emphasis on model/data/action contracts, cross-embodiment transfer, checkpoint comparison, and failure diagnosis.
      - bullet: Metric 3D and multi-view perception for robot interaction, including calibration sensitivity and robustness under distribution shift.
      - bullet: Latency-aware robot policy runtimes, asynchronous inference semantics, ROS2 execution, motion planning, and reliable control.
      - bullet: Reproducible embodied AI experimentation through controlled baselines, ablations, multi-seed evaluation, provenance tracking, and honest negative-result analysis.

    Currently Exploring:
      - bullet: VLA and robot foundation model adaptation for manipulation and cross-embodiment transfer.
      - bullet: Recovery-aware imitation learning, multimodal behavior, and flow-based robot policies.
      - bullet: OpenPI and π0-family training, evaluation, and deployment workflows.

    Professional Strengths:
      - bullet: Rigorous foundation in physics, mathematics, control, and system modeling, supported by Tsinghua dual-degree training.
      - bullet: Ability to move between model formulation, software implementation, evaluation, and experimental or edge-system debugging.
      - bullet: Hands-on experience across research prototypes, simulation benchmarks, GPU training systems, and delivered computer-vision applications.
      - bullet: Transferable systems perspective connecting sensing uncertainty, control, policy learning, and embodied execution.

