    Projects:
      - name: Robot Policy Learning in Manipulation Simulation
        summary: >
          Trained and evaluated imitation-learning policies in a ManiSkill robot
          manipulation environment, with emphasis on controlled comparison and
          closed-loop rollout behavior rather than benchmark claims.
        highlights:
          - Implemented experiments with Behavioral Cloning, Chunk BC, and Diffusion Policy.
          - Worked with demonstration datasets, action chunking, policy training, and closed-loop rollout evaluation.
          - Compared policy behavior through reproducible simulation experiments and failure analysis.

      - name: VLA Training, Evaluation, and Debugging
        summary: >
          Conducted engineering experiments with LeRobot, SmolVLA, and LIBERO to
          understand VLA training and inference pipelines, policy timing, and
          evaluation behavior.
        highlights:
          - Completed SmolVLA base training, multi-GPU training, LIBERO evaluation, replanning experiments, paired evaluation, and checkpoint comparisons.
          - Investigated action prefix/chunk execution, policy replanning, checkpoint compatibility, and observation/action contracts.
          - Used PyTorch DDP and DeepSpeed ZeRO on multi-RTX 4090 environments, including GPU memory, CUDA, checkpoint, and reproducibility debugging.

      - name: ROS2 Learned-policy Execution Pipeline
        summary: >
          Built a simulated learned-policy deployment architecture in ROS2 Jazzy
          for a Panda manipulator, separating policy inference from the
          higher-frequency robot execution layer.
        highlights:
          - Connected a Python policy node running at 20 Hz to a C++ executor running at 100 Hz.
          - Integrated MoveIt, ros2_control, KDL inverse kinematics, robot descriptions, transforms, and trajectory execution.
          - Examined asynchronous execution, latest-action semantics, policy latency, and the interface between learned actions and robot control.

      - name: 3D Perception, Latency-aware Control, and Motion Planning
        summary: >
          Explored perception-control and planning components in simulation,
          focusing on how representation, runtime latency, and geometric
          constraints affect robot execution.
        highlights:
          - Worked with point-cloud perception, 3D geometric representations, and RGB-versus-3D comparisons in closed-loop perception/control evaluation.
          - Conducted 3D perception and MuJoCo control experiments together with latency-aware and asynchronous policy-execution studies.
          - Implemented waypoint planning with inverse kinematics, collision checking, trajectory execution, and planning-failure analysis.

      - name: Quantum Inertial Sensing — Multi-channel Modeling and Crosstalk Decoupling
        summary: >
          Built a unified observation framework for four-axis inertial
          measurement scenarios and analyzed channel coupling under non-ideal
          symmetry and multi-channel mixing conditions.
        highlights:
          - Studied the joint effects of channel weights, phase bias, pulse non-idealities, AC Stark shifts, and cross-crosstalk through a multi-path phase-superposition model.
          - Explored system-level optimization through parameter solving and spatial separation.
          - Abstracted the workflow into a transferable observation, calibration, and signal-decoupling pipeline.

      - name: Complex Dynamical System Simulation and Experimental Platform Integration
        summary: >
          Combined numerical modeling with hands-on optical, thermal, magnetic,
          electronic, and control-system integration for complex sensing
          experiments.
        highlights:
          - Built Hamiltonian-based simulation and numerical-solving workflows for spatial distributions, magnetic fields, Zeeman sub-level effects, spectral asymmetry, and pulse calibration.
          - Iterated laser-frequency stabilization paths and completed AOM, fiber coupling, and saturated-absorption spectrum setup.
          - Contributed to insulation, heating, three-axis coil, temperature sensing, and staged PID-control systems.
          - Accumulated practical experience in hardware integration, system troubleshooting, sensitivity analysis, and engineering implementation.

    Research and Engineering Focus:
      - bullet: Robot learning and embodied AI for manipulation, with emphasis on imitation learning, policy evaluation, and reliable execution.
      - bullet: Vision and 3D perception for closed-loop robot interaction.
      - bullet: Robot software, motion planning, and latency-aware policy runtime systems.
      - bullet: Complex sensing-system modeling, calibration, uncertainty reasoning, and hardware-software integration.

    Currently Exploring:
      - bullet: Vision-Language-Action models and robot foundation models.
      - bullet: Advanced imitation learning and flow-based robot policies.
      - bullet: OpenPI and π0-family VLA deployment workflows.

    Professional Strengths:
      - bullet: Rigorous foundation in physics, mathematics, control, and system modeling, supported by Tsinghua dual-degree training.
      - bullet: Ability to move between model formulation, software implementation, evaluation, and experimental or edge-system debugging.
      - bullet: Hands-on experience across research prototypes, simulation benchmarks, GPU training systems, and delivered computer-vision applications.
      - bullet: Clear cross-domain trajectory from complex sensing and control toward robot learning and embodied intelligence.

