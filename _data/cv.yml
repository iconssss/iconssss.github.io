  summary: >
    Direct Ph.D. student at Tsinghua University with interdisciplinary training
    in physics, mathematics, measurement and control, and complex sensing
    systems. My work combines system modeling and experimental engineering with
    hands-on practice in computer vision, robot learning, VLA training and
    evaluation, ROS2 policy execution, 3D perception, and motion planning. I am
    seeking robot algorithm and embodied AI roles where rigorous modeling and
    end-to-end engineering are both important.

  sections:
    Experience:
      - company: Goertek Inc.
        position: Algorithm Engineering Intern — Computer Vision and Edge Deployment
        location: China
        start_date: 2026-06
        end_date: 2026-07
        summary: >
          Developed and delivered a multi-person motion perception and identity
          recognition system for intelligent-device interaction, covering the
          full workflow from requirements and data collection to evaluation,
          GPU optimization, Unity integration, and Windows edge deployment.
        highlights:
          - Built a multi-person pose and motion-analysis pipeline with YOLO Pose and OpenCV, including ROI/slot-based perception and a causal temporal state machine for periodic-motion recognition.
          - Implemented temporal keypoint fusion, scale normalization, motion gating, and event-level manual annotation and matching for systematic evaluation.
          - Applied FP16 inference, temporal micro-batching, asynchronous video acquisition, and geometry-consistent preprocessing to achieve approximately 30 FPS video processing on an RTX 3050.
          - Evaluated a three-person historical test video with 145 ground-truth events, 142 predictions, and 141 matches, corresponding to an approximately 97.2% event match rate.
          - Built a local identity module with YuNet and SFace and established the binding workflow between student identity and visual slots.
          - Integrated heartbeat, identity, task-control, and real-time result messages with a Unity client through UDP/OSC, then verified delivery on a Windows RTX 3050 edge workstation.

