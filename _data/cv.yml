  summary: >
    Direct Ph.D. student at Tsinghua University with interdisciplinary training
    in physics, mathematics, measurement and control, and complex sensing
    systems. I combine rigorous modeling and experimental engineering with
    hands-on work in visuomotor policy learning, VLA training and evaluation,
    computer vision, 3D perception, ROS2 policy execution, and latency-aware
    robot systems. I am seeking robot learning and embodied AI research
